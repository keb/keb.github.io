name: deploy
env:
  LUASMITH_VERSION: "0.10"
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tags:
        description: 'Description tag.'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download and Run luasmith
        run: |
          wget "https://github.com/jaredkrinke/luasmith/releases/download/$LUASMITH_VERSION/luasmith-$LUASMITH_VERSION-linux-x86_64.tar.gz" -O luasmith.tar.gz
          tar -xf luasmith.tar.gz
          ./luasmith theme.lua
      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          single-commit: true
          git-config-email: <>
          branch: gh-pages 
          folder: public
      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: public
